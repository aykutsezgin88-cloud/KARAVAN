<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karavan Akü Monitörü</title>
  <style>
    body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #1e1e1e; padding: 24px; border-radius: 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 1px solid #333; }
    h2 { margin: 0 0 15px 0; font-size: 1.1rem; color: #aaa; letter-spacing: 1px; }
    .battery-container { position: relative; width: 100px; height: 180px; border: 4px solid #444; border-radius: 16px; margin: 15px auto; padding: 4px; box-sizing: border-box; }
    .battery-cap { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 36px; height: 8px; background: #444; border-radius: 4px 4px 0 0; }
    .battery-fill { width: calc(100% - 8px); height: 0%; background: #00e676; border-radius: 10px; transition: height 0.5s, background 0.5s; position: absolute; bottom: 4px; left: 4px; }
    .battery-percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 2; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .metric { background: #2a2a2a; padding: 12px; border-radius: 14px; }
    .metric .label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }
    .metric .value { font-size: 1.2rem; font-weight: bold; margin-top: 4px; }
    .val-v { color: #00e676; }
    .val-a { color: #ff9100; }
    .val-w { color: #29b6f6; }
    button { background: #00e676; color: #000; border: none; padding: 15px; font-size: 1rem; font-weight: bold; border-radius: 30px; margin-top: 20px; width: 100%; cursor: pointer; }
    #status { margin-top: 10px; font-size: 0.75rem; color: #00e676; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>KARAVAN AKÜ MONİTÖRÜ</h2>
    <div class="battery-container">
      <div class="battery-cap"></div>
      <div class="battery-fill" id="batFill"></div>
      <div class="battery-percentage" id="batSoc">--%</div>
    </div>
    <div class="grid">
      <div class="metric">
        <div class="label">Voltaj</div>
        <div class="value val-v" id="valV">-- V</div>
      </div>
      <div class="metric">
        <div class="label">Akım</div>
        <div class="value val-a" id="valA">-- A</div>
      </div>
    </div>
    <div class="metric" style="margin-top: 10px;">
      <div class="label">Anlık Güç</div>
      <div class="value val-w" id="valW">-- W</div>
    </div>
    <button id="btnConnect" onclick="connectBLE()">BAĞLAN</button>
    <div id="status">Cihaz bekleniyor...</div>
  </div>

  <script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    async function connectBLE() {
      const status = document.getElementById("status");
      try {
        status.innerText = "Taranıyor...";
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        status.innerText = "Bağlanıyor...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(CHAR_UUID);

        await char.startNotifications();
        char.addEventListener('characteristicvaluechanged', handleData);
        status.innerText = "Bağlantı Başarılı, veri bekleniyor...";
        document.getElementById("btnConnect").style.display = "none";
      } catch (err) {
        status.innerText = "Hata: " + err.message;
      }
    }

    function handleData(event) {
      const value = event.target.value;
      let v = 0, i = 0;

      try {
        const rawStr = new TextDecoder().decode(value).trim();
        
        // ESP32'nin gönderdiği "V: ...V | A: ...A | W: ...W" formatını doğrudan okuyan akıllı regex ayrıştırıcı
        const vMatch = rawStr.match(/V:\s*([0-9.]+)/i);
        const iMatch = rawStr.match(/A:\s*([0-9.-]+)/i);

        if (vMatch) v = parseFloat(vMatch[1]);
        if (iMatch) i = parseFloat(iMatch[1]);

        // Eğer eşleşme olmazsa eski yöntemleri dene
        if (isNaN(v) || isNaN(i)) {
          const parts = rawStr.split(/[,;\s|]+/);
          for (let p of parts) {
            let num = parseFloat(p);
            if (!isNaN(num)) {
              if (v === 0) v = num;
              else if (i === 0) i = num;
            }
          }
        }
      } catch (e) {
        v = 0;
        i = 0;
      }

      if (isNaN(v)) v = 0;
      if (isNaN(i)) i = 0;

      const w = (v * i).toFixed(1);
      // LiFePO4 için yaklaşık % hesaplama (25V boş, 29.2V dolu)
      let soc = Math.round(((v - 25.0) / (29.2 - 25.0)) * 100);
      soc = Math.min(Math.max(soc, 0), 100);

      document.getElementById("status").innerText = "Canlı Veri Alınıyor";
      document.getElementById("valV").innerText = v.toFixed(2) + " V";
      document.getElementById("valA").innerText = (i > 0 ? "+" : "") + i.toFixed(2) + " A";
      document.getElementById("valW").innerText = w + " W";
      document.getElementById("batSoc").innerText = soc + "%";

      const fill = document.getElementById("batFill");
      fill.style.height = soc + "%";
      fill.style.background = soc > 50 ? "#00e676" : (soc > 20 ? "#ffb300" : "#ff3d00");
    }
  </script>
</body>
</html>
